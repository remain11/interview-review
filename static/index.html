<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<meta name="referrer" content="no-referrer">
<title>八股复习</title>
<link rel="stylesheet" href="vendor/hl-light.css" id="hl-light">
<link rel="stylesheet" href="vendor/hl-dark.css" id="hl-dark" disabled>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/review">八股复习</a>
  <nav aria-label="主导航">
    <a href="#/review" data-route="review">刷题</a>
    <a href="#/bank" data-route="bank">题库</a>
    <a href="#/stats" data-route="stats">统计</a>
    <a href="#/settings" data-route="settings">设置</a>
  </nav>
  <span class="save-state" id="save-state" aria-live="polite"></span>
  <button class="icon-btn" id="theme-btn" title="切换深色/浅色" aria-label="切换深色/浅色">◐</button>
</header>
<main id="app" tabindex="-1"><p class="muted center">加载中…</p></main>
<div id="toast" role="status" aria-live="polite"></div>
<dialog id="dlg">
  <form method="dialog">
    <p id="dlg-msg"></p>
    <div class="dlg-actions">
      <button value="cancel" class="btn">取消</button>
      <button value="ok" class="btn danger" id="dlg-ok">确定</button>
    </div>
  </form>
</dialog>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script src="vendor/highlight.min.js"></script>
<script src="js/core.js"></script>
<script src="js/render.js"></script>
<script src="js/review.js"></script>
<script src="js/bank.js"></script>
<script src="js/settings.js"></script>
<script src="js/app.js"></script>
</body>
</html>
